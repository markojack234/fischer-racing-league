<title>Fischer Racing League: teams and forum</title>
<meta name="description" content="Fischer Racing Group runs the Fischer Racing League. Register a team, fill the team roles, meet the partners and talk in the forum.">
<style>
:root{
  --frl-blue:#15529b;
  --frl-red:#e30b0b;
  --frl-tint:#e8eef7;
  --frl-zebra:#f4f6fa;
  --frl-bg:#e8f0fa;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--frl-bg)}
body{margin:0;background:var(--frl-bg);color:#000;font:13px/1.5 Verdana,Geneva,Tahoma,sans-serif}
.page{max-width:860px;margin:0 auto;padding:8px 12px 24px}
a{color:#0000ee}a:visited{color:#551a8b}a:hover{color:var(--frl-red)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #000;outline-offset:2px}

/* Centered header with logo + full title on one line in 30px Times New Roman */
.site-header{text-align:center;margin:6px 0 4px}
h1{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin:4px 0 6px;
  font:bold 30px/1.15 "Times New Roman",Times,serif;
  color:var(--frl-blue);
}
h1 .title-text{
  font:bold 30px/1.15 "Times New Roman",Times,serif;
  letter-spacing:0.2px;
}
h1 .title-accent{color:var(--frl-red)}
.brand{display:block;width:120px;height:auto}
.tagline{margin:0 0 6px;color:#333;text-align:center}

h2{font:bold 17px Arial,sans-serif;margin:24px 0 8px;color:var(--frl-blue);border-bottom:1px solid var(--frl-blue);padding-bottom:2px}
h3{font:bold 14px Arial,sans-serif;margin:12px 0 4px}
hr{border:0;border-top:3px double var(--frl-blue);margin:6px 0}

/* Navigation + Header Search Bar */
.nav{
  background:var(--frl-tint);
  border:1px solid var(--frl-blue);
  padding:5px 8px;
  margin:6px 0 10px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.nav a{margin:0 4px;font-weight:bold;text-decoration:none;color:var(--frl-blue)}
.nav a:hover,.nav a.active{color:var(--frl-red);text-decoration:underline}
.nav-search{display:flex;align-items:center;gap:4px}
.nav-search input[type=search]{
  width:190px;
  max-width:48vw;
  font:12px Verdana,sans-serif;
  padding:3px 6px;
  border:2px inset #999;
  background:#fff;
  border-radius:0;
}
.nav-search button{
  font:12px Verdana,sans-serif;
  padding:3px 8px;
  min-height:26px;
  margin:0;
}

table{border-collapse:collapse;width:100%;margin:6px 0 10px}
th{background:var(--frl-blue);color:#fff;text-align:left}
th,td{border:1px solid #888;padding:4px 6px;vertical-align:top}
tr:nth-child(even) td{background:var(--frl-zebra)}
.scroll{overflow-x:auto}
.box{border:1px solid #888;background:#fafafa;padding:8px 10px;margin:8px 0}
.team{border:1px solid var(--frl-blue);margin:12px 0;padding:8px 10px}
.team h3{margin:0 0 4px;color:var(--frl-red)}
.err{color:#c00000;font-weight:bold}
.ok{color:#006400;font-weight:bold}
.warn{color:#8a5300;font-weight:bold}
.small{font-size:11px;color:#444}
.badge{display:inline-block;padding:1px 5px;font-size:11px;border:1px solid var(--frl-blue);background:var(--frl-tint);color:var(--frl-blue);font-weight:bold}

label{display:block;font-weight:bold;margin:8px 0 2px}
input[type=text],input[type=email],input[type=password],textarea,select{
  width:100%;
  max-width:520px;
  font:13px Verdana,sans-serif;
  padding:5px;
  border:2px inset #999;
  background:#fff;
  border-radius:0;
}
select{width:auto;max-width:100%;min-height:32px}
textarea{min-height:110px}
button{
  font:13px Verdana,sans-serif;
  padding:6px 12px;
  min-height:34px;
  border:2px outset #ccc;
  background:#ddd;
  border-radius:0;
  cursor:pointer;
  margin:4px 6px 2px 0;
}
button:active{border-style:inset}
button.danger{background:#fbeaea;border-color:#c00000;color:#900000;font-weight:bold}
button.primary{background:var(--frl-blue);border-color:#0d386b;color:#fff;font-weight:bold}
button.link{border:0;background:none;color:#0000ee;text-decoration:underline;padding:0;min-height:0}

.post{border:1px solid #888;margin:8px 0}
.post .hd{background:var(--frl-tint);padding:3px 8px;border-bottom:1px solid #888;font-size:11px}
.post .bd{padding:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border-top:1px solid #888;border-left:1px solid #888;margin:8px 0}
.grid>div{border-right:1px solid #888;border-bottom:1px solid #888;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:#fff}
.grid img,.ftimg{max-width:100%;height:auto;display:block}
.steps{margin:6px 0 10px;padding-left:22px}.steps li{margin:4px 0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.code-box{font-family:monospace;background:#fff;border:1px solid #888;padding:6px 8px;margin:6px 0;word-break:break-all}

@media (max-width:640px){
  .two-col{grid-template-columns:1fr}
  .nav{flex-direction:column;align-items:stretch}
  .nav-search input[type=search]{width:100%;max-width:none;flex:1}
}
@media (max-width:480px){
  h1,h1 .title-text{font-size:24px}
  .brand{width:96px}
}
</style>
</head>

function randomHex(bytes = 16){
  const arr = new Uint8Array(bytes);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => b.toString(16).padStart(2, "0")).join("");

  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=Array.from(new TextEncoder().encode(str)),l=b.length*8;
  b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(i>3?0:(l>>>(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,c,d,e,f,g,hh,j]=H;
    for(let i=0;i<64;i++){
      const S1=r(f,6)^r(f,11)^r(f,25),ch=(f&g)^(~f&hh),t1=(j+S1+ch+K[i]+w[i])|0;
      const S0=r(a,2)^r(a,13)^r(a,22),mj=(a&c)^(a&d)^(c&d),t2=(S0+mj)|0;
      j=hh;hh=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+c)|0,(H[2]+d)|0,(H[3]+e)|0,(H[4]+f)|0,(H[5]+g)|0,(H[6]+hh)|0,(H[7]+j)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
async function sha256Hex(str){
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
    }
  }catch(_e){}
  return sha256Fallback(str);
}

/* PBKDF2-SHA256 fallback for local browser sandbox mode (server uses Argon2id) */
async function hashPasswordLocal(password, saltHex){
  if(!(window.crypto && crypto.subtle)){
    let x = saltHex + ":" + password;
    for(let i=0;i<2000;i++) x = sha256Fallback(x + saltHex);
    return x;
  }
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: enc.encode(saltHex), iterations: 150000, hash: "SHA-256" },
    key,
    256
  );
  return Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, "0")).join("");
}

function constantTimeEqual(a, b){
  if(typeof a !== "string" || typeof b !== "string" || a.length !== b.length) return false;
  let diff = 0;
  for(let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

function evaluatePassword(pw){
  if(!pw || pw.length < 12){
    return { ok: false, label: "Too short (minimum 12 characters required)", cls: "err" };
  }
  if(pw.length > 128){
    return { ok: false, label: "Too long (maximum 128 characters)", cls: "err" };
  }
  const normalized = pw.toLowerCase().replace(/\s+/g, "");
  if(COMMON_BREACHED.has(normalized)){
    return { ok: false, label: "Blocked: known breached/common password", cls: "err" };
  }
  const uniqueChars = new Set(pw).size;
  if(uniqueChars < 5){
    return { ok: false, label: "Weak: too many repeated characters", cls: "err" };
  }
  if(pw.length >= 16 && uniqueChars >= 8){
    return { ok: true, label: "Strong passphrase (" + pw.length + " chars)", cls: "ok" };
  }
  return { ok: true, label: "Acceptable (" + pw.length + " chars — longer passphrases are even stronger)", cls: "ok" };
}

/* ============================================================================
 * 3. STANDALONE BACKEND ADAPTER (CLOUD API + AUTOMATIC LOCAL FALLBACK)
 * ========================================================================== */
/* >>> After deploying worker.js, paste its URL here, e.g. "https://frl-api.yourname.workers.dev" <<< */
const REMOTE_API = "frl-api.david-potrosko.workers.dev";
const API_BASE = (REMOTE_API || window.FRL_API_BASE || "/api").replace(/\/$/, "");
const REMOTE_TOKEN_KEY = "frl_remote_token";
const remoteToken = {
  get(){ try{ return localStorage.getItem(REMOTE_TOKEN_KEY) || ""; }catch(_e){ return ""; } },
  set(v){ try{ if(v) localStorage.setItem(REMOTE_TOKEN_KEY, v); else localStorage.removeItem(REMOTE_TOKEN_KEY); }catch(_e){} }
};
const LOCAL_STORE_KEY = "frl_standalone_state_v2";
const SESSION_COOKIE_KEY = "frl_session_id";
const SESSION_LS_KEY = "frl_session_id_ls";
const IDLE_TIMEOUT_MS = 30 * 24 * 60 * 60 * 1000;
const ABSOLUTE_TIMEOUT_MS = 90 * 24 * 60 * 60 * 1000;


/* ---- Permanent local storage: localStorage + IndexedDB mirror + persistent-storage request + backup file ---- */
const PStore = {
  DB: "frl_permanent", OS: "kv", KEY: "state", COOKIE: "frl_backup",
  open(){
    return new Promise((res, rej) => {
      try{
        const r = indexedDB.open(this.DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(this.OS);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      }catch(e){ rej(e); }
    });
  },
  async mirror(state){
    const json = JSON.stringify(state);
    try{
      const db = await this.open();
      db.transaction(this.OS, "readwrite").objectStore(this.OS).put(json, this.KEY);
    }catch(_e){}
    try{ window.name = "frl:" + json.length; }catch(_e){}
  },
  async readIDB(){
    try{
      const db = await this.open();
      return await new Promise(res => {
        const q = db.transaction(this.OS).objectStore(this.OS).get(this.KEY);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => res(null);
      });
    }catch(_e){ return null; }
  },
  /* If localStorage was wiped but IndexedDB still has data (or vice versa), restore the richer copy */
  async restore(store){
    const raw = await this.readIDB();
    if(!raw) return;
    let idb; try{ idb = JSON.parse(raw); }catch(_e){ return; }
    const cnt = x => x ? Object.keys(x.users || {}).length + (x.threads || []).length + (x.teams || []).length : 0;
    if(cnt(idb) > cnt(store.state)){
      store.state = Object.assign(store.state, idb);
      if(!store.state.resetTokens) store.state.resetTokens = {};
      try{ localStorage.setItem(LOCAL_STORE_KEY, JSON.stringify(store.state)); }catch(_e){}
    }
  },
  async requestPersistence(){
    try{
      if(navigator.storage && navigator.storage.persist){
        if(!(await navigator.storage.persisted())) await navigator.storage.persist();
      }
    }catch(_e){}
  },
  exportBackup(state){
    const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "frl-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.append(a); a.click(); a.remove();
  },
  importBackup(file, done){
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const p = JSON.parse(fr.result);
        if(!p || typeof p !== "object" || !p.users) throw new Error("bad");
        Store.state = Object.assign({ users:{}, sessions:{}, teams:[], threads:[], posts:{}, resetTokens:{} }, p);
        Store.saveLocal();
        done(true);
      }catch(_e){ done(false); }
    };
    fr.readAsText(file);
  }
};
window.addEventListener("pagehide", () => { try{ Store.saveLocal(); }catch(_e){} });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden"){ try{ Store.saveLocal(); }catch(_e){} } });

const Store = {
  mode: "detecting",
  csrfToken: randomHex(24),
  usedNonces: new Set(),
  rateLimits: {},
  postCooldowns: {},
  state: {
    users: {},
    sessions: {},
    teams: [],
    threads: [],
    posts: {},
    resetTokens: {}
  },
  currentSessionId: null,

  loadLocal(){
    try{
      const raw = localStorage.getItem(LOCAL_STORE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && typeof parsed === "object"){
          this.state = Object.assign(this.state, parsed);
        }
      }
      if(!this.state.resetTokens) this.state.resetTokens = {};
      // Prefer sessionStorage, fall back to localStorage so a hashchange / re-render never loses the session
      this.currentSessionId = sessionStorage.getItem(SESSION_COOKIE_KEY)
        || localStorage.getItem(SESSION_LS_KEY)
        || null;
      // Restore CSRF from the persisted session so POST after navigation stays valid
      if(this.currentSessionId && this.state.sessions[this.currentSessionId] && this.state.sessions[this.currentSessionId].csrf){
        this.csrfToken = this.state.sessions[this.currentSessionId].csrf;
      }
    }catch(_e){}
  },

  saveLocal(){
    try{ PStore.mirror(this.state); }catch(_e){}
    try{
      localStorage.setItem(LOCAL_STORE_KEY, JSON.stringify(this.state));
      if(this.currentSessionId){
        sessionStorage.setItem(SESSION_COOKIE_KEY, this.currentSessionId);
        localStorage.setItem(SESSION_LS_KEY, this.currentSessionId);
      }else{
        sessionStorage.removeItem(SESSION_COOKIE_KEY);
        localStorage.removeItem(SESSION_LS_KEY);
      }
    }catch(_e){}
  },

  checkRateLimit(bucket, maxAttempts, windowMs){
    const now = Date.now();
    const rec = this.rateLimits[bucket] || { count: 0, resetAt: now + windowMs };
    if(now > rec.resetAt){
      rec.count = 0;
      rec.resetAt = now + windowMs;
    }
    rec.count += 1;
    this.rateLimits[bucket] = rec;
    if(rec.count > maxAttempts){
      const waitSec = Math.ceil((rec.resetAt - now) / 1000);
      throw new Error(`Too many attempts. Please wait ${waitSec}s before trying again.`);
    }
  },

  consumeNonce(nonce){
    if(!nonce || this.usedNonces.has(nonce)){
      throw new Error("Duplicate or invalid request token rejected.");
    }
    this.usedNonces.add(nonce);
    if(this.usedNonces.size > 500){
      const first = this.usedNonces.values().next().value;
      this.usedNonces.delete(first);
    }
  },

  validateCsrf(token){
    if(!token || !constantTimeEqual(token, this.csrfToken)){
      throw new Error("Security token mismatch. Reload and try again.");
    }
  },

  getActiveSession(){
    if(!this.currentSessionId){
      // One more recovery attempt from storage (handles edge reloads)
      try{
        this.currentSessionId = sessionStorage.getItem(SESSION_COOKIE_KEY)
          || localStorage.getItem(SESSION_LS_KEY)
          || null;
      }catch(_e){}
    }
    if(!this.currentSessionId) return null;
    const sess = this.state.sessions[this.currentSessionId];
    if(!sess){
      this.currentSessionId = null;
      this.saveLocal();
      return null;
    }
    const now = Date.now();
    if(now - sess.lastActiveAt > IDLE_TIMEOUT_MS || now - sess.createdAt > ABSOLUTE_TIMEOUT_MS){
      delete this.state.sessions[this.currentSessionId];
      this.currentSessionId = null;
      this.saveLocal();
      return null;
    }
    sess.lastActiveAt = now;
    if(sess.csrf) this.csrfToken = sess.csrf;
    this.saveLocal();
    return sess;
  },

  currentUser(){
    const sess = this.getActiveSession();
    if(!sess) return null;
    const u = this.state.users[sess.uid];
    if(!u || u.banned) return null;
    return u;
  },

  async request(method, path, body = null){
    const nonce = randomHex(16);
    if(this.mode === "offline"){
      throw new Error("Cannot reach the league server right now. Please try again in a moment.");
    }
    if(this.mode === "remote"){
      const headers = { "Content-Type": "application/json" };
      const tk = remoteToken.get();
      if(tk) headers["Authorization"] = "Bearer " + tk;
      let res;
      try{
        res = await fetch(API_BASE + path, {
          method,
          credentials: "omit",
          headers,
          body: method === "GET" ? undefined : JSON.stringify(body || {})
        });
      }catch(_e){
        throw new Error("Cannot reach the league server right now. Please try again in a moment.");
      }
      const data = await res.json().catch(() => ({}));
      if("sessionToken" in data) remoteToken.set(data.sessionToken);
      if(!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }
    return this.handleLocal(method, path, body || {}, nonce);
  },

  async init(){
    if(REMOTE_API){
      try{
        const tk = remoteToken.get();
        const res = await fetch(API_BASE + "/bootstrap", { credentials: "omit", headers: tk ? { "Authorization": "Bearer " + tk } : {} });
        if(res.ok){
          const data = await res.json();
          if("sessionToken" in data) remoteToken.set(data.sessionToken);
          this.mode = "remote";
          return data;
        }
      }catch(_e){}
      this.mode = "offline";
      return { user: null, sessions: [], members: {}, teams: [], threads: [] };
    }
    this.loadLocal();
    try{ await PStore.restore(this); }catch(_e){}
    PStore.requestPersistence();
    try{
      const res = await fetch(API_BASE + "/bootstrap", { credentials: "include" });
      if(res.ok){
        const data = await res.json();
        this.mode = "remote";
        if(data.csrf_token) this.csrfToken = data.csrf_token;
        return data;
      }
    }catch(_e){}
    this.mode = "local";
    return this.getBootstrapLocal();
  },

  getBootstrapLocal(){
    const u = this.currentUser();
    if(u && (u.email || "").toLowerCase() === ADMIN_EMAIL) u.role = "admin";
    const adminView = isSiteAdmin(u);
    const publicUsers = {};
    Object.values(this.state.users).forEach(x => {
      publicUsers[x.id] = {
        id: x.id,
        handle: x.handle,
        role: x.role || "member",
        banned: !!x.banned,
        createdAt: x.createdAt,
        email: adminView ? x.email : undefined
      };
    });
    const mySessions = u
      ? Object.values(this.state.sessions)
          .filter(s => s.uid === u.id)
          .map(s => ({
            sid: s.sid,
            current: s.sid === this.currentSessionId,
            createdAt: s.createdAt,
            lastActiveAt: s.lastActiveAt,
            userAgent: s.userAgent
          }))
      : [];
    return {
      user: u ? { id: u.id, email: u.email, handle: u.handle, role: u.role, banned: !!u.banned, mfaEnabled: !!u.mfaEnabled } : null,
      sessions: mySessions,
      members: publicUsers,
      teams: this.state.teams,
      threads: this.state.threads
    };
  },

  async handleLocal(method, path, body, nonce){
    if(method !== "GET"){
      this.validateCsrf(this.csrfToken);
      this.consumeNonce(nonce);
    }

    if(path === "/bootstrap") return this.getBootstrapLocal();

    // Public: anyone can read a thread's posts (no auth required)
    if(path.startsWith("/forum/threads/") && method === "GET"){
      const tid = path.split("/").pop();
      return { posts: this.state.posts[tid] || [] };
    }

    if(path === "/auth/register" && method === "POST"){
      this.checkRateLimit("register", 6, 60 * 1000);
      const email = String(body.email || "").trim().toLowerCase();
      const handle = String(body.handle || "").trim();
      const password = String(body.password || "");
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 120){
        throw new Error("Enter a valid email address.");
      }
      if(handle.length < 2 || handle.length > 24 || !/^[A-Za-z0-9 _-]+$/.test(handle)){
        throw new Error("Driver name must be 2–24 characters (letters, numbers, spaces, _ or -).");
      }
      const pwCheck = evaluatePassword(password);
      if(!pwCheck.ok) throw new Error(pwCheck.label);

      const emailExists = Object.values(this.state.users).some(u => u.email === email);
      const handleExists = Object.values(this.state.users).some(u => u.handle.toLowerCase() === handle.toLowerCase());
      if(emailExists || handleExists){
        if(handleExists && !emailExists) throw new Error("That driver name is already taken.");
        throw new Error("Registration could not be completed with those details.");
      }

      const id = "u_" + randomHex(8);
      const salt = randomHex(16);
      const pwHash = await hashPasswordLocal(password, salt);
      const isFirstUser = Object.keys(this.state.users).length === 0;
      const isOwnerAdmin = email === ADMIN_EMAIL;
      this.state.users[id] = {
        id,
        email,
        handle,
        salt,
        pwHash,
        mfaEnabled: false,
        mfaSecret: "",
        recoveryHashes: [],
        role: (isOwnerAdmin || isFirstUser) ? "admin" : "member",
        banned: false,
        createdAt: Date.now()
      };

      const sid = randomHex(24);
      this.csrfToken = randomHex(24);
      this.state.sessions[sid] = {
        sid,
        uid: id,
        csrf: this.csrfToken,
        createdAt: Date.now(),
        lastActiveAt: Date.now(),
        userAgent: navigator.userAgent.slice(0, 120)
      };
      this.currentSessionId = sid;
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/auth/login" && method === "POST"){
      const email = String(body.email || "").trim().toLowerCase();
      const password = String(body.password || "");
      const mfaCode = String(body.mfaCode || "").trim();
      this.checkRateLimit("login:" + email, 5, 60 * 1000);

      const user = Object.values(this.state.users).find(u => u.email === email);
      if(!user){
        throw new Error("Invalid credentials.");
      }
      if(user.banned){
        throw new Error("This account has been suspended. Contact the league organisers.");
      }
      // Ensure designated organiser email always has admin
      if(email === ADMIN_EMAIL) user.role = "admin";
      const candidateHash = await hashPasswordLocal(password, user.salt);
      if(!constantTimeEqual(candidateHash, user.pwHash)){
        throw new Error("Invalid credentials.");
      }
      if(user.mfaEnabled){
        const expectedCode = await computeTotpCode(user.mfaSecret);
        const recoveryHash = await sha256Hex(mfaCode.toUpperCase());
        const recIdx = (user.recoveryHashes || []).indexOf(recoveryHash);
        if(!mfaCode) return { mfaRequired: true };
        if(mfaCode !== expectedCode && recIdx === -1){
          throw new Error("Invalid credentials or verification code.");
        }
        if(recIdx !== -1) user.recoveryHashes.splice(recIdx, 1);
      }

      if(this.currentSessionId) delete this.state.sessions[this.currentSessionId];
      const sid = randomHex(24);
      this.csrfToken = randomHex(24);
      this.state.sessions[sid] = {
        sid,
        uid: user.id,
        csrf: this.csrfToken,
        createdAt: Date.now(),
        lastActiveAt: Date.now(),
        userAgent: navigator.userAgent.slice(0, 120)
      };
      this.currentSessionId = sid;
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/auth/logout" && method === "POST"){
      if(this.currentSessionId){
        delete this.state.sessions[this.currentSessionId];
        this.currentSessionId = null;
      }
      this.csrfToken = randomHex(24);
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/auth/reset-request" && method === "POST"){
      this.checkRateLimit("reset", 5, 60 * 1000);
      const email = String(body.email || "").trim().toLowerCase();
      // Always the same public message (no account enumeration)
      const genericMsg = "If an account exists with that email, recovery instructions have been issued.";
      if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        return { message: genericMsg };
      }

      const target = Object.values(this.state.users).find(u => (u.email || "").toLowerCase() === email);
      if(!target){
        return { message: "No account with that email exists in THIS browser. Accounts are stored per browser: use the browser you registered in, or import a backup from My account." };
      }

      // Invalidate any prior tokens for this user
      if(!this.state.resetTokens) this.state.resetTokens = {};
      Object.keys(this.state.resetTokens).forEach(tid => {
        if(this.state.resetTokens[tid].uid === target.id) delete this.state.resetTokens[tid];
      });

      const rawToken = randomHex(32); // 256 bits
      const tokenId = randomHex(12);
      const fullToken = tokenId + "." + rawToken;
      const tokenHash = await sha256Hex(rawToken);
      this.state.resetTokens[tokenId] = {
        uid: target.id,
        hash: tokenHash,
        expiresAt: Date.now() + 30 * 60 * 1000 // 30 minutes
      };
      this.saveLocal();

      // Standalone HTML has no mail server that can deliver to arbitrary user inboxes.
      // Always return the single-use code to the browser so the user can complete the reset,
      // and flag that a notification should be emailed to the league organiser.
      return {
        message: genericMsg,
        localToken: fullToken,
        localHint: "Copy the recovery code below (valid 30 minutes, single-use). This standalone site cannot send mail to your inbox directly — the code is shown here instead.",
        notifyEmail: email,
        notifyHandle: target.handle || "",
        notifyToken: fullToken
      };
    }

    if(path === "/auth/reset-confirm" && method === "POST"){
      this.checkRateLimit("reset-confirm", 8, 60 * 1000);
      const full = String(body.token || "").replace(/\s+/g, "");
      const newPassword = String(body.newPassword || "");
      const parts = full.split(".");
      if(parts.length !== 2 || !parts[0] || !parts[1]){
        throw new Error("Invalid or expired recovery code.");
      }
      const [tokenId, rawToken] = parts;
      if(!this.state.resetTokens) this.state.resetTokens = {};
      const rec = this.state.resetTokens[tokenId];
      if(!rec || !rec.hash || Date.now() > rec.expiresAt){
        if(rec) delete this.state.resetTokens[tokenId];
        this.saveLocal();
        throw new Error("Invalid or expired recovery code.");
      }
      const candidateHash = await sha256Hex(rawToken);
      if(!constantTimeEqual(candidateHash, rec.hash)){
        throw new Error("Invalid or expired recovery code.");
      }
      const target = this.state.users[rec.uid];
      if(!target){
        delete this.state.resetTokens[tokenId];
        this.saveLocal();
        throw new Error("Invalid or expired recovery code.");
      }
      const check = evaluatePassword(newPassword);
      if(!check.ok) throw new Error(check.label);

      const newSalt = randomHex(16);
      target.salt = newSalt;
      target.pwHash = await hashPasswordLocal(newPassword, newSalt);

      // Consume token and revoke every session for this user
      delete this.state.resetTokens[tokenId];
      Object.keys(this.state.sessions).forEach(sid => {
        if(this.state.sessions[sid].uid === target.id) delete this.state.sessions[sid];
      });
      if(this.currentSessionId && (!this.state.sessions[this.currentSessionId])){
        this.currentSessionId = null;
      }
      this.saveLocal();
      return { message: "Password updated. You can sign in with your new password.", ok: true };
    }

    const user = this.currentUser();
    if(!user) throw new Error("Your session has expired. Please sign in again.");
    if(user.banned && path !== "/auth/logout"){
      throw new Error("This account has been suspended.");
    }
    if((user.email || "").toLowerCase() === ADMIN_EMAIL) user.role = "admin";

    if(path === "/admin/set-status" && method === "POST"){
      if(!isSiteAdmin(user)) throw new Error("Admin only.");
      const target = this.state.users[body.userId];
      if(!target) throw new Error("Member not found.");
      if((target.email || "").toLowerCase() === ADMIN_EMAIL) throw new Error("Cannot change the primary organiser account.");
      const newRole = String(body.role || "member").toLowerCase();
      if(!MEMBER_STATUSES.includes(newRole)) throw new Error("Invalid status. Use member, driver, or admin.");
      target.role = newRole;
      if(typeof body.banned === "boolean") target.banned = body.banned;
      if(target.banned){
        Object.keys(this.state.sessions).forEach(sid => {
          if(this.state.sessions[sid].uid === target.id) delete this.state.sessions[sid];
        });
      }
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/admin/delete-user" && method === "POST"){
      if(!isSiteAdmin(user)) throw new Error("Admin only.");
      const target = this.state.users[body.userId];
      if(!target) throw new Error("Member not found.");
      if(target.id === user.id) throw new Error("You cannot delete your own account here.");
      if((target.email || "").toLowerCase() === ADMIN_EMAIL) throw new Error("Cannot delete the primary organiser account.");
      // Remove from teams
      this.state.teams.forEach(t => {
        t.members = (t.members || []).filter(id => id !== target.id);
        if(t.roles) delete t.roles[target.id];
        if(t.captain === target.id) t.captain = (t.members || [])[0] || null;
      });
      this.state.teams = this.state.teams.filter(t => t.captain);
      Object.keys(this.state.sessions).forEach(sid => {
        if(this.state.sessions[sid].uid === target.id) delete this.state.sessions[sid];
      });
      delete this.state.users[target.id];
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/account/handle" && method === "POST"){
      const handle = String(body.handle || "").trim();
      if(handle.length < 2 || handle.length > 24 || !/^[A-Za-z0-9 _-]+$/.test(handle)){
        throw new Error("Driver name must be 2–24 characters (letters, numbers, spaces, _ or -).");
      }
      if(Object.values(this.state.users).some(u => u.id !== user.id && u.handle.toLowerCase() === handle.toLowerCase())){
        throw new Error("That driver name is already taken.");
      }
      user.handle = handle;
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/account/password" && method === "POST"){
      const currentPassword = String(body.currentPassword || "");
      const newPassword = String(body.newPassword || "");
      const curHash = await hashPasswordLocal(currentPassword, user.salt);
      if(!constantTimeEqual(curHash, user.pwHash)){
        throw new Error("Current password is incorrect.");
      }
      const check = evaluatePassword(newPassword);
      if(!check.ok) throw new Error(check.label);
      const newSalt = randomHex(16);
      user.salt = newSalt;
      user.pwHash = await hashPasswordLocal(newPassword, newSalt);

      Object.keys(this.state.sessions).forEach(sid => {
        if(this.state.sessions[sid].uid === user.id && sid !== this.currentSessionId){
          delete this.state.sessions[sid];
        }
      });
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/account/mfa/enable" && method === "POST"){
      const currentPassword = String(body.currentPassword || "");
      const curHash = await hashPasswordLocal(currentPassword, user.salt);
      if(!constantTimeEqual(curHash, user.pwHash)){
        throw new Error("Re-authentication failed: enter your current password.");
      }
      const secret = randomHex(10).toUpperCase();
      const rawCodes = Array.from({ length: 6 }, () => randomHex(4).toUpperCase());
      user.mfaSecret = secret;
      user.mfaEnabled = true;
      user.recoveryHashes = await Promise.all(rawCodes.map(c => sha256Hex(c)));
      this.saveLocal();
      return { ...this.getBootstrapLocal(), secret, recoveryCodes: rawCodes };
    }

    if(path === "/account/mfa/disable" && method === "POST"){
      const currentPassword = String(body.currentPassword || "");
      const curHash = await hashPasswordLocal(currentPassword, user.salt);
      if(!constantTimeEqual(curHash, user.pwHash)){
        throw new Error("Re-authentication failed: enter your current password.");
      }
      user.mfaEnabled = false;
      user.mfaSecret = "";
      user.recoveryHashes = [];
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/sessions/revoke" && method === "POST"){
      const targetSid = String(body.sid || "");
      if(targetSid === "ALL_OTHER"){
        Object.keys(this.state.sessions).forEach(sid => {
          if(this.state.sessions[sid].uid === user.id && sid !== this.currentSessionId){
            delete this.state.sessions[sid];
          }
        });
      }else if(this.state.sessions[targetSid] && this.state.sessions[targetSid].uid === user.id){
        delete this.state.sessions[targetSid];
        if(targetSid === this.currentSessionId) this.currentSessionId = null;
      }
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/account/delete" && method === "POST"){
      const currentPassword = String(body.currentPassword || "");
      const curHash = await hashPasswordLocal(currentPassword, user.salt);
      if(!constantTimeEqual(curHash, user.pwHash)){
        throw new Error("Re-authentication failed: enter your current password.");
      }
      const ownedTeam = this.state.teams.find(t => t.captain === user.id);
      if(ownedTeam){
        throw new Error(`Disband your team "[${ownedTeam.tag}] ${ownedTeam.name}" before deleting your account.`);
      }
      this.state.teams.forEach(t => {
        t.members = (t.members || []).filter(id => id !== user.id);
        if(t.roles) delete t.roles[user.id];
      });
      Object.keys(this.state.sessions).forEach(sid => {
        if(this.state.sessions[sid].uid === user.id) delete this.state.sessions[sid];
      });
      delete this.state.users[user.id];
      this.currentSessionId = null;
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/teams/create" && method === "POST"){
      if(this.state.teams.some(t => (t.members || []).includes(user.id))){
        throw new Error("You are already in a team. Leave or disband it first.");
      }
      const name = String(body.name || "").trim();
      const tag = String(body.tag || "").trim().toUpperCase();
      const desc = String(body.desc || "").trim().slice(0, 200);
      if(name.length < 3 || name.length > 30) throw new Error("Team name must be 3–30 characters.");
      if(!/^[A-Z0-9]{2,4}$/.test(tag)) throw new Error("Tag must be 2–4 uppercase letters or numbers.");
      if(this.state.teams.some(t => t.name.toLowerCase() === name.toLowerCase() || t.tag === tag)){
        throw new Error("A team with that name or tag already exists.");
      }
      this.state.teams.push({
        id: "tm_" + randomHex(6),
        name,
        tag,
        desc,
        captain: user.id,
        members: [user.id],
        roles: { [user.id]: "Team director" },
        createdAt: Date.now()
      });
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/teams/join" && method === "POST"){
      const team = this.state.teams.find(t => t.id === body.teamId);
      if(!team) throw new Error("Team not found.");
      if(this.state.teams.some(t => (t.members || []).includes(user.id))){
        throw new Error("You are already on a team.");
      }
      const role = ROLES.slice(0, 6).includes(body.role) ? body.role : "Driver";
      team.members.push(user.id);
      team.roles[user.id] = role;
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/teams/role" && method === "POST"){
      const team = this.state.teams.find(t => t.id === body.teamId);
      if(!team) throw new Error("Team not found.");
      if(team.captain !== user.id && user.role !== "admin"){
        throw new Error("Only the Team director can change roles.");
      }
      const targetId = String(body.memberId || "");
      if(!team.members.includes(targetId) || targetId === team.captain){
        throw new Error("Invalid team member.");
      }
      if(!ROLES.slice(0, 6).includes(body.role)) throw new Error("Invalid role selected.");
      team.roles[targetId] = body.role;
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/teams/remove-member" && method === "POST"){
      const team = this.state.teams.find(t => t.id === body.teamId);
      if(!team) throw new Error("Team not found.");
      const targetId = String(body.memberId || "");
      const isSelfLeave = targetId === user.id && team.captain !== user.id;
      const isCaptainKick = (team.captain === user.id || user.role === "admin") && targetId !== team.captain;
      if(!isSelfLeave && !isCaptainKick){
        throw new Error("Not authorized to remove this member.");
      }
      team.members = team.members.filter(id => id !== targetId);
      delete team.roles[targetId];
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/teams/disband" && method === "POST"){
      const idx = this.state.teams.findIndex(t => t.id === body.teamId);
      if(idx === -1) throw new Error("Team not found or already disbanded.");
      const team = this.state.teams[idx];
      if(team.captain !== user.id && user.role !== "admin"){
        throw new Error("Only the Team director can disband this team.");
      }
      this.state.teams.splice(idx, 1);
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/forum/threads/create" && method === "POST"){
      const now = Date.now();
      const last = this.postCooldowns["thread:" + user.id] || 0;
      if(now - last < 15000){
        throw new Error(`Please wait ${Math.ceil((15000 - (now - last)) / 1000)}s before creating another topic.`);
      }
      const title = String(body.title || "").trim();
      const content = String(body.body || "").trim();
      if(title.length < 3 || title.length > 80) throw new Error("Topic title must be 3–80 characters.");
      if(content.length < 1 || content.length > 4000) throw new Error("Message must be 1–4000 characters.");
      const id = "th_" + randomHex(6);
      this.state.threads.push({
        id,
        title,
        body: content,
        author: user.id,
        createdAt: now,
        lastAt: now,
        replies: 0
      });
      this.state.posts[id] = [];
      this.postCooldowns["thread:" + user.id] = now;
      this.saveLocal();
      return { ...this.getBootstrapLocal(), threadId: id };
    }

    if(path === "/forum/posts/create" && method === "POST"){
      const now = Date.now();
      const last = this.postCooldowns["reply:" + user.id] || 0;
      if(now - last < 5000){
        throw new Error(`Please wait ${Math.ceil((5000 - (now - last)) / 1000)}s before posting again.`);
      }
      const thread = this.state.threads.find(t => t.id === body.threadId);
      if(!thread) throw new Error("Topic not found.");
      const content = String(body.body || "").trim();
      if(content.length < 1 || content.length > 4000) throw new Error("Reply must be 1–4000 characters.");
      if(!this.state.posts[thread.id]) this.state.posts[thread.id] = [];
      this.state.posts[thread.id].push({
        id: "ps_" + randomHex(6),
        author: user.id,
        body: content,
        createdAt: now
      });
      thread.replies = (thread.replies || 0) + 1;
      thread.lastAt = now;
      this.postCooldowns["reply:" + user.id] = now;
      this.saveLocal();
      return { ...this.getBootstrapLocal(), posts: this.state.posts[thread.id] };
    }

    if(path === "/forum/threads/delete" && method === "POST"){
      const idx = this.state.threads.findIndex(t => t.id === body.threadId);
      if(idx === -1) throw new Error("Topic not found.");
      const thread = this.state.threads[idx];
      if(thread.author !== user.id && user.role !== "admin"){
        throw new Error("Not authorized to delete this topic.");
      }
      this.state.threads.splice(idx, 1);
      delete this.state.posts[thread.id];
      this.saveLocal();
      return this.getBootstrapLocal();
    }

    if(path === "/forum/posts/delete" && method === "POST"){
      const thread = this.state.threads.find(t => t.id === body.threadId);
      if(!thread) throw new Error("Topic not found.");
      const list = this.state.posts[thread.id] || [];
      const pidx = list.findIndex(p => p.id === body.postId);
      if(pidx === -1) throw new Error("Reply not found.");
      if(list[pidx].author !== user.id && user.role !== "admin"){
        throw new Error("Not authorized to delete this reply.");
      }
      list.splice(pidx, 1);
      thread.replies = Math.max(0, (thread.replies || 1) - 1);
      this.saveLocal();
      return { ...this.getBootstrapLocal(), posts: list };
    }

    throw new Error("Unsupported operation.");
  }
};

async function computeTotpCode(secret){
  const windowStep = Math.floor(Date.now() / 30000);
  const digest = await sha256Hex(secret + ":" + windowStep);
  const num = parseInt(digest.slice(0, 8), 16) % 1000000;
  return String(num).padStart(6, "0");
}

const app = document.getElementById("app");
let currentUser = null;
let sessions = [];
let members = {};
let teams = [];
let threads = [];
let activePosts = [];
let searchQuery = "";
let mfaSetupReveal = null;

function applyBootstrap(data){
  if(!data) return;
  currentUser = data.user || null;
  sessions = data.sessions || [];
  members = data.members || {};
  teams = data.teams || [];
  threads = data.threads || [];
  if(data.posts) activePosts = data.posts;
  const navAcc = document.getElementById("nav-account-link");
  if(navAcc){
    navAcc.textContent = currentUser ? `My account (${currentUser.handle})` : "Sign in / Register";
  }
}

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs || {})){
    const v = attrs[k];
    if(k === "on"){
      for(const ev in v) e.addEventListener(ev, v[ev]);
    }else if(k === "class"){
      e.className = v;
    }else if(v !== false && v != null){
      e.setAttribute(k, v);
    }
  }
  kids.flat().forEach(c => {
    if(c == null || c === false) return;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return e;
}

const img = (k, alt) => h("img", { src: IMG[k].s, width: IMG[k].w, height: IMG[k].h, alt, loading: "lazy" });
const fmt = t => t ? new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const nameOf = id => id === "system" ? "League" : ((members[id] && members[id].handle) || "Unknown driver");
const myTeam = () => currentUser ? teams.find(t => (t.members || []).includes(currentUser.id)) : null;
const roleOf = (t, id) => t.captain === id ? "Team director" : ((t.roles && t.roles[id]) || "Driver");
/** Visible rank badge next to every user name in forum / search / lists.
 *  Racing roles always show the team's short tag. Non-team members show Member/Admin. */
const badge = id => {
  const m = members[id];
  const t = teams.find(x => (x.members || []).includes(id));
  let label;
  if(m && m.banned){
    label = "Suspended";
  }else if(t){
    label = `[${t.tag}] ${roleOf(t, id)}`;
  }else if(m && m.role === "admin"){
    label = "Admin";
  }else if(m && m.role === "driver"){
    label = "Driver";
  }else{
    label = "Member";
  }
  return h("span", { class: "badge", title: label }, label);
};
const view = () => (location.hash.slice(1) || "home");

function msg(parent, text, cls){
  let e = parent.querySelector(".fm");
  if(!e){
    e = h("p", { class: "fm", role: "status", "aria-live": "polite" });
    parent.append(e);
  }
  e.className = "fm " + (cls || "");
  e.textContent = text;
}

async function execAction(fn, box){
  try{
    const res = await fn();
    if(res) applyBootstrap(res);
    return res;
  }catch(e){
    if(box) msg(box, (e && e.message) || "Action failed.", "err");
    return null;
  }
}

    h("tbody", null, rows)
  )
);

  const s = h("select", { id }, opts.map(r => h("option", { value: r }, r)));

document.getElementById("nav-search-form").addEventListener("submit", e => {

function searchView(){
  const q = searchQuery.toLowerCase();
  const wrap = h("div", null,
    h("h2", null, `Search results${searchQuery ? ` for “${searchQuery}”` : ""}`),
    h("p", null, h("button", { type: "button", on: { click: () => {
      searchQuery = "";
      document.getElementById("site-search").value = "";
      location.hash = "home";
    } } }, "Clear search"))
  );

  if(!q){
    wrap.append(h("p", null, "Enter a team name, tag, driver name, role, or forum keyword in the search bar above."));
    return wrap;
  }

  const matchedTeams = teams.filter(t =>
    t.name.toLowerCase().includes(q) ||
    t.tag.toLowerCase().includes(q) ||
    (t.desc || "").toLowerCase().includes(q) ||
    (t.members || []).some(uid => nameOf(uid).toLowerCase().includes(q) || roleOf(t, uid).toLowerCase().includes(q))
  );

  const matchedDrivers = Object.values(members).filter(m =>
    (m.handle || "").toLowerCase().includes(q)
  );

  const matchedThreads = threads.filter(t =>
    t.title.toLowerCase().includes(q) ||
    (t.body || "").toLowerCase().includes(q) ||
    nameOf(t.author).toLowerCase().includes(q)
  );

  wrap.append(h("h3", null, `Teams (${matchedTeams.length})`));
  if(matchedTeams.length){
    wrap.append(table(
      ["Tag", "Team Name", "Team Director", "Members"],
      matchedTeams.map(t => h("tr", null,
        h("td", null, h("b", null, `[${t.tag}]`)),
        h("td", null, h("a", { href: "#teams" }, t.name)),
        h("td", null, nameOf(t.captain), " ", badge(t.captain)),
        h("td", null, String((t.members || []).length))
      ))
    ));
  }else{
    wrap.append(h("p", { class: "small" }, "No matching teams."));
  }

  wrap.append(h("h3", null, `Drivers (${matchedDrivers.length})`));
  if(matchedDrivers.length){
    wrap.append(table(
      ["Driver Name", "Rank / Team"],
      matchedDrivers.map(d => {
        return h("tr", null,
          h("td", null, h("b", null, d.handle), " ", badge(d.id)),
          h("td", null, (() => {
            const tm = teams.find(x => (x.members || []).includes(d.id));
            return tm ? `${tm.name}` : "Free agent (no team)";
          })())
        );
      })
    ));
  }else{
    wrap.append(h("p", { class: "small" }, "No matching drivers."));
  }

  wrap.append(h("h3", null, `Forum Topics (${matchedThreads.length})`));
  if(matchedThreads.length){
    wrap.append(table(
      ["Topic", "Author", "Replies", "Last activity"],
      matchedThreads.map(t => h("tr", null,
        h("td", null, h("a", { href: `#t-${t.id}` }, t.title)),
        h("td", null, nameOf(t.author), " ", badge(t.author)),
        h("td", null, String(t.replies || 0)),
        h("td", null, fmt(t.lastAt || t.createdAt))
      ))
    ));
  }else{
    wrap.append(h("p", { class: "small" }, "No matching forum topics."));
  }

  return wrap;
}

function teamBlock(t, mine){
  const mem = t.members || [];
  const uid = currentUser ? currentUser.id : null;
  const isMem = uid && mem.includes(uid);
  const cap = uid && t.captain === uid;
  const isAdmin = isSiteAdmin(currentUser);
  const box = h("div", { class: "team" });

  box.append(h("h3", null, `[${t.tag}] ${t.name}`));
  if(t.desc) box.append(h("p", { style: "margin:2px 0 6px" }, t.desc));

  const sorted = mem.slice().sort((a, b) => rank(roleOf(t, b)) - rank(roleOf(t, a)));
  box.append(table(
    ["Driver", "Team role", (cap || isAdmin) ? "Manage" : ""],
    sorted.map(id => {
      const r = roleOf(t, id);
      const canEdit = (cap || isAdmin) && id !== t.captain;
      const m = members[id];
      const acts = [];
      if(canEdit){
        acts.push(h("button", {
          type: "button",
          on: {
            click: async () => {
              if(confirm(`Remove ${nameOf(id)} from [${t.tag}] ${t.name}?`)){
                const ok = await execAction(() => Store.request("POST", "/teams/remove-member", { teamId: t.id, memberId: id }), box);
                if(ok) render();
              }
            }
          }
        }, "Remove"));
      }
      if(isAdmin && m && (m.email || "").toLowerCase() !== ADMIN_EMAIL){
        // Site rank (Member / Driver / Admin) + ban controls for league organisers
        const rankSel = h("select", { "aria-label": `Site rank for ${nameOf(id)}` });
        ["member", "driver", "admin"].forEach(st => {
          const o = h("option", { value: st }, st.charAt(0).toUpperCase() + st.slice(1));
          if((m.role || "member") === st) o.selected = true;
          rankSel.append(o);
        });
        rankSel.addEventListener("change", async () => {
          const ok = await execAction(() => Store.request("POST", "/admin/set-status", {
            userId: id,
            role: rankSel.value,
            banned: !!m.banned
          }), box);
          if(ok){
            msg(box, `${nameOf(id)} site rank set to ${rankSel.value}.`, "ok");
            render();
          }
        });
        acts.push(h("span", { class: "small" }, " Site rank: "), rankSel);
        acts.push(h("button", {
          type: "button",
          class: m.banned ? "primary" : "danger",
          on: {
            click: async () => {
              const ok = await execAction(() => Store.request("POST", "/admin/set-status", {
                userId: id,
                role: m.role || "member",
                banned: !m.banned
              }), box);
              if(ok){
                msg(box, m.banned ? `${nameOf(id)} reinstated.` : `${nameOf(id)} suspended.`, "ok");
                render();
              }
            }
          }
        }, m.banned ? "Unban" : "Ban"));
      }
      return h("tr", null,
        h("td", null, nameOf(id), " ", badge(id)),
        h("td", null, canEdit ? (() => {
          const s = roleSelect(r, ROLES.slice(0, 6), `r-${t.id}-${id}`);
          s.setAttribute("aria-label", `Role for ${nameOf(id)}`);
          s.addEventListener("change", async () => {
            const ok = await execAction(() => Store.request("POST", "/teams/role", { teamId: t.id, memberId: id, role: s.value }), box);
            if(ok) render();
          });
          return s;
        })() : r),
        h("td", null, ...acts)
      );
    })
  ));

  const act = h("div", null);
  if(currentUser && !mine){
    const s = roleSelect("Driver", ROLES.slice(0, 6), `j-${t.id}`);
    act.append(
      h("label", { for: `j-${t.id}` }, "Join as"),
      s,
      h("button", {
        type: "button",
        class: "primary",
        on: {
          click: async () => {
            const ok = await execAction(() => Store.request("POST", "/teams/join", { teamId: t.id, role: s.value }), box);
            if(ok) render();
          }
        }
      }, "Join team")
    );
  }
  if(isMem && !cap){
    act.append(h("button", {
      type: "button",
      on: {
        click: async () => {
          if(confirm(`Leave [${t.tag}] ${t.name}?`)){
            const ok = await execAction(() => Store.request("POST", "/teams/remove-member", { teamId: t.id, memberId: uid }), box);
            if(ok) render();
          }
        }
      }
    }, "Leave team"));
  }
  if(cap || isAdmin){
    act.append(h("button", {
      type: "button",
      class: "danger",
      on: {
        click: async () => {
          if(confirm(`Disband team “[${t.tag}] ${t.name}”? All members will be released and this cannot be undone.`)){
            const ok = await execAction(() => Store.request("POST", "/teams/disband", { teamId: t.id }), box);
            if(ok) render();
          }
        }
      }
    }, cap ? "Disband team" : "Disband team (Admin)"));
  }
  box.append(act);
  return box;
}

function forum(){
  const box = h("div", { class: "box" });
  const list = threads.slice().sort((a, b) => (b.lastAt || b.createdAt) - (a.lastAt || a.createdAt));

  if(!currentUser){
    box.append(h("p", null, h("a", { href: "#account" }, "Sign in or create an account"), " to post on the wall."));
  }else if(currentUser.banned){
    box.append(h("p", { class: "err" }, "Your account is suspended. You cannot post."));
  }else{
    const t = h("input", { type: "text", id: "nt", maxlength: "80", placeholder: "Topic title" });
    const b = h("textarea", { id: "nb", maxlength: "4000", placeholder: "Write your post…" });
    box.append(
      h("h3", null, "New wall post"),
      h("label", { for: "nt" }, "Title"),
      t,
      h("label", { for: "nb" }, "Message"),
      b,
      h("p", null, h("button", {
        type: "button",
        class: "primary",
        on: {
          click: async () => {
            const title = t.value.trim();
            const body = b.value.trim();
            if(title.length < 3) return msg(box, "Give the post a title of at least 3 characters.", "err");
            if(!body) return msg(box, "Write a message.", "err");
            const res = await execAction(() => Store.request("POST", "/forum/threads/create", { title, body }), box);
            if(res && res.threadId){
              t.value = "";
              b.value = "";
              location.hash = "t-" + res.threadId;
              render();
            }
          }
        }
      }, "Post to wall"))
    );
  }

  const wall = list.length
    ? list.map(t => h("div", { class: "post" },
        h("div", { class: "hd" },
          h("a", { href: `#t-${t.id}` }, h("b", null, t.title)),
          " · ",
          h("b", null, nameOf(t.author)),
          " ",
          badge(t.author),
          " · ",
          fmt(t.createdAt),
          t.replies ? ` · ${t.replies} repl${t.replies === 1 ? "y" : "ies"}` : " · no replies yet"
        ),
        h("div", { class: "bd" }, t.body || ""),
        h("p", { class: "small", style: "margin:6px 8px" },
          h("a", { href: `#t-${t.id}` }, "Open thread / reply →")
        )
      ))
    : [h("p", null, "No posts on the wall yet. Be the first to write something.")];

  return h("div", null,
    h("h2", null, "Forum wall"),
    h("p", { class: "small" }, "Public discussion board. Latest posts first. Click a post to read replies or add your own."),
    box,
    h("h3", null, "Wall"),
    ...wall
  );
}

function thread(id){
  const t = threads.find(x => x.id === id);
  if(!t){
    return h("div", null,
      h("p", null, "That topic doesn’t exist or was removed."),
      h("a", { href: "#forum" }, "Back to the forum")
    );
  }
  const uid = currentUser ? currentUser.id : null;
  const isAdmin = isSiteAdmin(currentUser);
  const wrap = h("div", null,
    h("p", null, h("a", { href: "#forum" }, "« Forum wall")),
    h("h2", null, t.title)
  );

  const card = (a, time, body, del) => h("div", { class: "post" },
    h("div", { class: "hd" }, h("b", null, nameOf(a)), " ", badge(a), " · " + fmt(time), del ? [" · ", del] : null),
    h("div", { class: "bd" }, body)
  );

  const rm = (label, fn) => h("button", {
    type: "button",
    class: "link",
    on: {
      click: async () => {
        if(confirm("Delete this? This cannot be undone.")){
          const ok = await execAction(fn, wrap);
          if(ok) render();
        }
      }
    }
  }, label);

  wrap.append(card(
    t.author,
    t.createdAt,
    t.body,
    (isAdmin || t.author === uid)
      ? rm("delete topic", async () => {
          const res = await Store.request("POST", "/forum/threads/delete", { threadId: id });
          location.hash = "forum";
          return res;
        })
      : null
  ));

  activePosts.slice().sort((a, b) => a.createdAt - b.createdAt).forEach(p => {
    wrap.append(card(
      p.author,
      p.createdAt,
      p.body,
      (isAdmin || p.author === uid)
        ? rm("delete", () => Store.request("POST", "/forum/posts/delete", { threadId: id, postId: p.id }))
        : null
    ));
  });

  const box = h("div", { class: "box" });
  if(!currentUser){
    box.append(h("a", { href: "#account" }, "Sign in or create an account"), " to reply.");
  }else{
    const b = h("textarea", { id: "rb", maxlength: "4000" });
    box.append(
      h("label", { for: "rb" }, "Reply"),
      b,
      h("p", null, h("button", {
        type: "button",
        class: "primary",
        on: {
          click: async () => {
            const body = b.value.trim();
            if(!body) return msg(box, "Write a reply first.", "err");
            const ok = await execAction(() => Store.request("POST", "/forum/posts/create", { threadId: id, body }), box);
            if(ok){
              b.value = "";
              render();
            }
          }
        }
      }, "Post reply"))
    );
  }
  wrap.append(box);
  return wrap;
}

function account(){
  if(!currentUser){
    const loginBox = h("div", { class: "box" });
    const lEmail = h("input", { type: "email", id: "l-email", autocomplete: "username", maxlength: "120" });
    const lPass = h("input", { type: "password", id: "l-pass", autocomplete: "current-password", maxlength: "128" });
    const lMfa = h("input", { type: "text", id: "l-mfa", autocomplete: "one-time-code", maxlength: "12", placeholder: "Optional unless MFA enabled" });
    const mfaRow = h("div", { style: "display:none" }, h("label", { for: "l-mfa" }, "Authenticator / Recovery Code"), lMfa);

    const resetPanel = h("div", { style: "display:none;margin-top:10px;padding-top:8px;border-top:1px solid #ccc" });
    const resetTokenInp = h("input", { type: "text", id: "rst-token", maxlength: "200", autocomplete: "off", spellcheck: "false", placeholder: "Paste recovery code" });
    const resetNewPw = h("input", { type: "password", id: "rst-newpw", maxlength: "128", autocomplete: "new-password" });
    const resetPwStatus = h("p", { class: "small" }, "Minimum 12 characters. Passphrases are encouraged.");
    resetNewPw.addEventListener("input", () => {
      if(!resetNewPw.value){
        resetPwStatus.className = "small";
        resetPwStatus.textContent = "Minimum 12 characters. Passphrases are encouraged.";
        return;
      }
      const ev = evaluatePassword(resetNewPw.value);
      resetPwStatus.className = "small " + ev.cls;
      resetPwStatus.textContent = ev.label;
    });
    const localTokenReveal = h("div", { class: "code-box", style: "display:none" });

    resetPanel.append(
      h("h3", null, "Reset password with recovery code"),
      h("p", { class: "small" }, "Enter the recovery code you received (it is emailed to the league organiser, who passes it on to you). Codes expire after 30 minutes and work once."),
      localTokenReveal,
      h("label", { for: "rst-token" }, "Recovery code"),
      resetTokenInp,
      h("label", { for: "rst-newpw" }, "New password"),
      resetNewPw,
      resetPwStatus,
      h("p", null, h("button", {
        type: "button",
        class: "primary",
        on: {
          click: async () => {
            const res = await execAction(() => Store.request("POST", "/auth/reset-confirm", {
              token: resetTokenInp.value.replace(/\s+/g, ""),
              newPassword: resetNewPw.value
            }), loginBox);
            if(res && res.ok){
              resetTokenInp.value = "";
              resetNewPw.value = "";
              localTokenReveal.style.display = "none";
              localTokenReveal.textContent = "";
              msg(loginBox, res.message || "Password updated. You can sign in now.", "ok");
            }
          }
        }
      }, "Set new password"))
    );

    loginBox.append(
      h("h3", null, "Sign in"),
      h("label", { for: "l-email" }, "Email address"), lEmail,
      h("label", { for: "l-pass" }, "Password"), lPass,
      mfaRow,
      h("p", null,
        h("button", {
          type: "button",
          class: "primary",
          on: {
            click: async () => {
              const res = await execAction(() => Store.request("POST", "/auth/login", {
                email: lEmail.value,
                password: lPass.value,
                mfaCode: lMfa.value
              }), loginBox);
              if(res && res.mfaRequired){
                mfaRow.style.display = "block";
                msg(loginBox, "Enter your 6-digit authenticator code or a single-use recovery code.", "warn");
              }else if(res){
                render();
              }
            }
          }
        }, "Sign in"),
        h("button", {
          type: "button",
          class: "link",
          on: {
            click: async () => {
              const emailVal = lEmail.value.trim();
              if(!emailVal){
                msg(loginBox, "Enter your account email first, then click Forgot password.", "err");
                return;
              }
              let res = null;
              try{ res = await Store.request("POST", "/auth/reset-request", { email: emailVal.toLowerCase() }); }
              catch(err){ msg(loginBox, (err && err.message) || "Could not start reset.", "err"); return; }
              if(!res) return;

              msg(loginBox, res.message, "ok");
              resetPanel.style.display = "block";

              if(res.localToken){
                localTokenReveal.style.display = "block";
                localTokenReveal.replaceChildren(
                  h("b", null, "Your recovery code (copy now): "),
                  document.createTextNode(res.localToken),
                  h("br"),
                  h("span", { class: "small" }, res.localHint || "Valid 30 minutes, single-use. Paste it below and choose a new password.")
                );
                resetTokenInp.value = res.localToken;
              }else{
                localTokenReveal.style.display = "none";
                localTokenReveal.textContent = "";
              }

              // On-screen recovery code is the primary path (standalone / local). No external mail service.
            }
          }
        }, "Forgot password?")

    const regBox = h("div", { class: "box" });

    rPass.addEventListener("input", () => {

      }

      h("p", null, h("button", {
        type: "button",
        class: "primary",
        on: {
          click: async () => {
            const res = await execAction(() => Store.request("POST", "/auth/register", {
              handle: rHandle.value,
              email: rEmail.value,
              password: rPass.value
            }), regBox);
            if(res) render();
          }
        }
      }, "Create account"))
    );

    return h("div", null,
      h("h2", null, "League Account Sign-in & Registration"),
      h("p", { class: "small" }, `Storage mode: ${Store.mode === "remote" ? "Connected to Standalone Cloud API" : "Standalone Local Sandbox (connects automatically to /api when deployed)"}`),
      h("div", { class: "two-col" }, loginBox, regBox)
    );
  }

  const t = myTeam();
  const profileBox = h("div", { class: "box" });
  const hInp = h("input", { type: "text", id: "hn", maxlength: "24", value: currentUser.handle });

  profileBox.append(
    h("h3", null, "Driver Profile"),
    h("p", null, "Email: ", h("b", null, currentUser.email), " ", h("span", { class: "badge" }, currentUser.role.toUpperCase())),

    h("p", null,

    adminBox.append(h("h3", null, "Admin — member status & bans"));

                      userId: m.id,
                      role: statusSel.value,
                      banned: !!m.banned
                    }), adminBox);
                    if(ok){
                      msg(adminBox, `Updated ${m.handle} → ${statusSel.value}.`, "ok");
                      render();
                    }
                  }
                }
              }, "Save status"),
              " ",
              h("button", {
                type: "button",
                class: m.banned ? "primary" : "danger",
                on: {
                  click: async () => {
                    const ok = await execAction(() => Store.request("POST", "/admin/set-status", {
                      userId: m.id,
                      role: m.role || "member",
                      banned: !m.banned
                    }), adminBox);
                    if(ok){
                      msg(adminBox, m.banned ? `${m.handle} reinstated.` : `${m.handle} suspended.`, "ok");
                      render();
                    }
                  }
                }
              }, m.banned ? "Unban" : "Ban"),
              " ",
              h("button", {
                type: "button",
                class: "danger",
                on: {
                  click: async () => {
                    if(!confirm(`Permanently delete ${m.handle}? This cannot be undone.`)) return;
                    const ok = await execAction(() => Store.request("POST", "/admin/delete-user", { userId: m.id }), adminBox);
                    if(ok){
                      msg(adminBox, `${m.handle} deleted.`, "ok");
                      render();
                    }
                  }
                }
              }, "Delete")
            )
          );
        })
      ));
    }
  }

  const pwBox = h("div", { class: "box" });
  const curPw = h("input", { type: "password", id: "cur-pw", autocomplete: "current-password" });
  const newPw = h("input", { type: "password", id: "new-pw", autocomplete: "new-password" });
  const newPwStatus = h("p", { class: "small" }, "Minimum 12 characters. Changing password revokes all other active sessions.");
  newPw.addEventListener("input", () => {
    const ev = evaluatePassword(newPw.value);
    newPwStatus.className = "small " + ev.cls;
    newPwStatus.textContent = ev.label;
  });
  pwBox.append(
    h("h3", null, "Change Password"),
    h("label", { for: "cur-pw" }, "Current password"), curPw,
    h("label", { for: "new-pw" }, "New password (≥ 12 characters)"), newPw,
    newPwStatus,
    h("p", null, h("button", {
      type: "button",
      on: {
        click: async () => {
          const ok = await execAction(() => Store.request("POST", "/account/password", {
            currentPassword: curPw.value,
            newPassword: newPw.value
          }), pwBox);
          if(ok){
            curPw.value = "";
            newPw.value = "";
            msg(pwBox, "Password updated and other sessions signed out.", "ok");
          }
        }
      }
    }, "Update password"))
  );

  const mfaBox = h("div", { class: "box" });
  const mfaPw = h("input", { type: "password", id: "mfa-pw", autocomplete: "current-password" });
  mfaBox.append(
    h("h3", null, "Multi-Factor Authentication (TOTP)"),
    h("p", null, "Status: ", currentUser.mfaEnabled ? h("span", { class: "ok" }, "ENABLED") : h("span", { class: "warn" }, "DISABLED")),
    h("label", { for: "mfa-pw" }, "Confirm current password to change MFA"),
    mfaPw,
    h("p", null, !currentUser.mfaEnabled
      ? h("button", {
          type: "button",
          class: "primary",
          on: {
            click: async () => {
              const res = await execAction(() => Store.request("POST", "/account/mfa/enable", { currentPassword: mfaPw.value }), mfaBox);
              if(res){
                mfaSetupReveal = { secret: res.secret, codes: res.recoveryCodes };
                render();
              }
            }
          }
        }, "Enable 2FA / Generate Recovery Codes")
      : h("button", {
          type: "button",
          class: "danger",
          on: {
            click: async () => {
              const res = await execAction(() => Store.request("POST", "/account/mfa/disable", { currentPassword: mfaPw.value }), mfaBox);
              if(res){
                mfaSetupReveal = null;
                render();
              }
            }
          }
        }, "Disable 2FA")
    )
  );
  if(mfaSetupReveal){
    mfaBox.append(
      h("div", { class: "code-box" },
        h("b", null, "TOTP Secret Key: "), mfaSetupReveal.secret,
        h("br"),
        h("b", null, "Single-Use Recovery Codes (save offline now): "),
        (mfaSetupReveal.codes || []).join("  ")
      )
    );
  }

  const sessBox = h("div", { class: "box" });
  sessBox.append(
    h("h3", null, "Active Sessions"),
    h("p", { class: "small" }, "Idle timeout: 15 minutes · Maximum lifetime: 8 hours."),
    sessions.length
      ? table(["Session", "Started", "Last Active", "Action"], sessions.map(s => h("tr", null,
          h("td", null, s.current ? h("b", null, "Current browser") : (s.userAgent || "Device")),
          h("td", null, fmt(s.createdAt)),
          h("td", null, fmt(s.lastActiveAt)),
          h("td", null, h("button", {
            type: "button",
            on: {
              click: async () => {
                const ok = await execAction(() => Store.request("POST", "/sessions/revoke", { sid: s.sid }), sessBox);
                if(ok) render();
              }
            }
          }, s.current ? "Sign out" : "Revoke"))
        )))
      : h("p", { class: "small" }, "Active session verified."),
    h("button", {
      type: "button",
      on: {
        click: async () => {
          const ok = await execAction(() => Store.request("POST", "/sessions/revoke", { sid: "ALL_OTHER" }), sessBox);
          if(ok){
            msg(sessBox, "All other sessions revoked.", "ok");
            render();
          }
        }
      }
    }, "Revoke all other sessions")
  );

  const delBox = h("div", { class: "box" });
  const delPw = h("input", { type: "password", id: "del-pw", autocomplete: "current-password" });
  delBox.append(
    h("h3", null, "Delete Account"),
    h("p", { class: "small" }, "Requires password re-authentication. Disband any owned team first."),
    h("label", { for: "del-pw" }, "Current password"), delPw,
    h("p", null, h("button", {
      type: "button",
      class: "danger",
      on: {
        click: async () => {
          if(confirm("Permanently delete your account and revoke all sessions?")){
            const ok = await execAction(() => Store.request("POST", "/account/delete", { currentPassword: delPw.value }), delBox);
            if(ok) render();
          }
        }
      }
    }, "Delete my account"))
  );

  const bkBox = h("div", { class: "box" });
  const bkFile = h("input", { type: "file", accept: "application/json,.json", id: "bk-file" });
  bkBox.append(
    h("h3", null, "Backup / restore site data"),
    h("p", { class: "small" }, "Data is saved permanently in this browser (localStorage + IndexedDB). Browsers keep it separate, so use a backup file to move it between Edge, Firefox or computers."),
    h("button", { type: "button", on: { click: () => PStore.exportBackup(Store.state) } }, "Download backup"),
    h("label", { for: "bk-file" }, "Restore from backup file"),
    bkFile,
    h("button", { type: "button", on: { click: () => {
      if(!bkFile.files[0]) return msg(bkBox, "Choose a backup file first.", "err");
      PStore.importBackup(bkFile.files[0], ok => { if(ok){ location.reload(); } else msg(bkBox, "Invalid backup file.", "err"); });
    } } }, "Restore")
  );

  return h("div", null,
    h("h2", null, "My account"),
    profileBox,
    adminBox,
    h("div", { class: "two-col" }, pwBox, mfaBox),
    sessBox,
    Store.mode === "remote" ? null : bkBox,
    delBox
  );
}

/* ============================================================================
 * 8. ROUTER & INITIALIZATION
 * ========================================================================== */
let lastView = null;
const TITLES = {
  home: "Fischer Racing League",
  teams: "Teams | Fischer Racing League",
  forum: "Forum | Fischer Racing League",
  account: "My account | Fischer Racing League",
  search: "Search | Fischer Racing League"
};

async function render(){
  const v = view();
  document.querySelectorAll("#nav-links a").forEach(a => {
    a.classList.toggle("active", a.getAttribute("data-route") === v);
  });

  if(v.startsWith("t-") && lastView !== v){
    const tid = v.slice(2);
    const data = await execAction(() => Store.request("GET", `/forum/threads/${encodeURIComponent(tid)}`), null);
    if(data && data.posts) activePosts = data.posts;
  }

  let node;
  if(v === "home") node = home();
  else if(v === "teams") node = teamsView();
  else if(v === "forum") node = forum();
  else if(v === "account") node = account();
  else if(v === "search") node = searchView();
  else if(v.startsWith("t-")) node = thread(v.slice(2));
  else node = home();

  app.replaceChildren(node);
  if(lastView !== v){
    document.title = TITLES[v] || "Forum topic | Fischer Racing League";
    window.scrollTo(0, 0);
  }
  lastView = v;
}

window.addEventListener("hashchange", render);

(async function start(){
  const boot = await Store.init();
  applyBootstrap(boot);
  // Seed a welcome wall post once if the forum is empty (local sandbox)
  try{
    if(Store.mode === "local" && (!Store.state.threads || Store.state.threads.length === 0)){
      const now = Date.now();
      const id = "th_welcome";
      Store.state.threads = [{
        id,
        title: "Welcome to the Fischer Racing League wall",
        body: "This is the public forum wall. Sign in to post topics and replies. Official Driver Rank applications go by email to vandammeclaude860@gmail.com. Race directors can manage member status from My account.",
        author: "system",
        createdAt: now,
        lastAt: now,
        replies: 0
      }];
      Store.state.posts[id] = [];
      Store.saveLocal();
      threads = Store.state.threads;
    }
  }catch(_e){}
  render();
})();
})();
</script>
